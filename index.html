<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Header -->
    <header class="main-header">
        <div class="logo">
            <i class="fas fa-quote-right"></i>
            <h1>QuoteGen</h1>
        </div>
        <!-- Theme Toggle Moved to Header for cleaner UI -->
        <div class="header-actions">
            <button id="lang-toggle" class="lang-btn" aria-label="Switch to Urdu">اردو</button>
            <button id="theme-toggle" class="theme-btn" aria-label="Toggle Dark Mode">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </header>

    <div class="container">
        <div class="quote-box">
            <!-- Quote Content -->
            <div class="quote-content">
                <i class="fas fa-quote-left quote-icon"></i>
                <span id="quote" class="quote-text">Loading...</span>
                <i class="fas fa-quote-right quote-icon"></i>
            </div>

            <!-- Author -->
            <div class="quote-author">
                <span id="author"></span>
            </div>

            <!-- Action Buttons -->
            <div class="buttons">
                <button id="prev-quote" class="button prev-quote-btn" disabled>Previous Quote</button>
                <button id="tts-btn" class="button tts-btn" aria-label="Play quote audio">
                    <i class="fas fa-volume-up"></i>
                    Speak
                </button>
                <button id="fav-btn" class="button fav-btn" aria-label="Save to favorites">
                    <i class="fas fa-heart"></i>
                    Add to Favorites
                </button>
                <button id="view-fav-btn" class="button view-fav-btn" aria-label="View saved favorites">
                    <i class="fas fa-list"></i>
                    View Favorites
                </button>
                <a id="twitter" class="button" href="#" target="_blank" title="Tweet this quote!">
                    <i class="fab fa-twitter"></i>
                </a>
                <button id="whatsapp" class="button" aria-label="Share on WhatsApp">
                    <i class="fab fa-whatsapp"></i>
                    WhatsApp
                </button>
                <button id="next-quote" class="button new-quote-btn">Next Quote</button>
            </div>
        </div>

        <div id="favorites-modal" class="modal" hidden>
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Saved Quotes</h2>
                    <button id="close-fav" class="close-btn" aria-label="Close favorites">&times;</button>
                </div>
                <div id="favorites-list" class="favorites-list"></div>
            </div>
        </div>

        <!-- Loader -->
        <div class="loader" id="loader"></div>
    </div>

    <!-- Footer -->
    <footer class="main-footer">
        <p>&copy; 2026 Random Quote Generator. All rights reserved.</p>
        <div class="social-links">
            <a href="https://github.com/Muhammad-Usman55" target="_blank" rel="noopener" aria-label="GitHub">
                <i class="fab fa-github"></i>
            </a>
            <a href="https://www.linkedin.com/in/muhammadusman55/" target="_blank" rel="noopener" aria-label="LinkedIn">
                <i class="fab fa-linkedin"></i>
            </a>
            <a href="mailto:usmanshahidhnd2108@gmail.com" aria-label="Email">
                <i class="fas fa-envelope"></i>
            </a>
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
