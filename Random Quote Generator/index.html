<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Header -->
    <header class="main-header">
        <div class="logo">
            <i class="fas fa-quote-right"></i>
            <h1>QuoteGen</h1>
        </div>
        <!-- Theme Toggle Moved to Header for cleaner UI -->
        <button id="theme-toggle" class="theme-btn" aria-label="Toggle Dark Mode">
            <i class="fas fa-moon"></i>
        </button>
    </header>

    <div class="container">
        <div class="quote-box">
            <!-- Quote Content -->
            <div class="quote-content">
                <i class="fas fa-quote-left quote-icon"></i>
                <span id="quote" class="quote-text">Loading...</span>
                <i class="fas fa-quote-right quote-icon"></i>
            </div>

            <!-- Author -->
            <div class="quote-author">
                <span id="author"></span>
            </div>

            <!-- Action Buttons -->
            <div class="buttons">
                <a id="twitter" class="button" href="#" target="_blank" title="Tweet this quote!">
                    <i class="fab fa-twitter"></i>
                </a>
                <button id="new-quote" class="button new-quote-btn">New Quote</button>
            </div>
        </div>

        <!-- Loader -->
        <div class="loader" id="loader"></div>
    </div>

    <!-- Footer -->
    <footer class="main-footer">
        <p>&copy; 2026 Random Quote Generator. All rights reserved.</p>
        <div class="social-links">
            <a href="#"><i class="fab fa-github"></i></a>
            <a href="#"><i class="fab fa-linkedin"></i></a>
            <a href="#"><i class="fas fa-envelope"></i></a>
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
